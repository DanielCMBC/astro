name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show the scientific stack
        run: |
          python -c "import numpy, scipy, astropy, pandas; print('numpy', numpy.__version__); print('scipy', scipy.__version__); print('astropy', astropy.__version__); print('pandas', pandas.__version__)"

      # The architecture tests are the golden rule made mechanical: the
      # renderer may not import the data layer, render primitives may not
      # carry scientific fields, no module outside constants.py may hard-code
      # a physical constant. They run first because a failure there means the
      # rest of the suite is testing the wrong architecture.
      - name: Architecture / golden-rule tests
        run: pytest tests/regression/test_architecture.py -v

      # C3's claim is that every coordinate and distance is invariant under
      # exaggeration, level of detail and camera placement. That is worth
      # reading off a CI page as its own line rather than as part of a
      # thousand-test total, so it runs named and first.
      - name: Coordinate and distance inspector tests (Explorer C3)
        run: pytest tests/regression/test_explorer_c3.py -q

      # C3.5 is a module about conventions: a wrong line-of-sight sign or a
      # reflected basis produces orbits that look entirely plausible. The
      # checks against Astropy and the explicit sign test are worth their
      # own line on the CI page.
      - name: SystemFrame to ICRS basis tests (Explorer C3.5)
        run: pytest tests/regression/test_explorer_c35.py -q

      # C3.6 replaces the last deliberately closed gate - the coordinate
      # epoch - with real Gaia DR3 astrometry propagated by Astropy. The
      # failure it guards against is silent by construction: a missing
      # radial velocity read as zero, or a proper motion applied from the
      # wrong reference epoch, produces a confident position that is wrong
      # by more than the planet offset it was added to.
      - name: Astrometric epoch and space-motion tests (Explorer C3.6)
        run: pytest tests/regression/test_explorer_c36.py -q

      # C4a puts a model between the stellar physics and the figure. The
      # failure it guards against is a plot that recomputes a scientific
      # value and quietly disagrees with the panel beside it, or that omits
      # an unmeasured star in silence so the gap reads as "not interesting".
      - name: HR diagram integration tests (Explorer C4a)
        run: pytest tests/regression/test_explorer_c4a.py -q

      - name: Full test suite
        run: pytest -q

      - name: Offline check
        # The application must work from the committed snapshot with no
        # network. Everything below already runs offline; this asserts it,
        # and since C3.6 it asserts the astrometric state too: the Gaia
        # cache is committed, so a host's proper motion and reference epoch
        # must be readable and propagatable with the network unavailable.
        run: |
          python - <<'PY'
          import socket

          from astropy.time import Time

          from astro_explorer.app.vertical_slice import build_slice, load_reference_catalog
          from astro_explorer.coordinates.astrometry import MotionKnowledge

          class NoNetwork(socket.socket):
              def __init__(self, *a, **k):
                  raise OSError("the offline check forbids network access")

          socket.socket = NoNetwork

          catalog = load_reference_catalog()
          tiers = {}
          for host in ("HD 80606", "Kepler-11", "TRAPPIST-1", "HD 219134"):
              system = build_slice(host, catalog)
              state = system.astrometry
              propagated = system.host_astrometry(2460000.0)
              record = system.planets[0]
              row = system.absolute_planet_position(record, 2460000.0)
              print(
                  "{0:<12} {1:<3} planet(s)  {2:<20} {3:<12} abs-pos: {4}".format(
                      host,
                      len(system.planets),
                      "none" if state is None else state.knowledge.value,
                      "publishable" if propagated is not None
                      and propagated.is_publishable else "blocked",
                      "published" if row.is_known else "withheld",
                  )
              )
              # Every host in the committed snapshot is cross-matched, so a
              # missing state here means the cache did not ship.
              assert state is not None, host
              assert state.reference_epoch is not None, host
              assert state.reference_epoch.scale == "tcb", host
              tiers[host] = state.knowledge

          # The tiers have to stay distinguishable offline, or the check
          # would pass just as happily against a cache that had lost the
          # radial velocities and quietly called every host complete.
          assert tiers["HD 80606"] is MotionKnowledge.FULL_SPACE_MOTION
          assert tiers["TRAPPIST-1"] is MotionKnowledge.DIRECTION_ONLY
          PY

  opengl:
    name: OpenGL 3.3 core (software Mesa)
    runs-on: ubuntu-latest

    env:
      # Force Mesa's software rasteriser: the runner has no GPU.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      # llvmpipe advertises a lower version by default; the shaders are
      # GLSL 330 and the pipeline is core profile.
      MESA_GL_VERSION_OVERRIDE: "3.3"
      MESA_GLSL_VERSION_OVERRIDE: "330"
      PYOPENGL_PLATFORM: egl

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Mesa software GL and EGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglx-mesa0 libgl1-mesa-dri libglapi-mesa \
            libegl1 libegl-mesa0 libgbm1 \
            libosmesa6 \
            xvfb

      - name: Install the package with the renderer
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,render]"

      # This step is the point of the job: it fails loudly if no context can
      # be created, so a misconfigured runner cannot silently skip every
      # OpenGL test and still report green.
      - name: Verify a GL 3.3 core context and compile all shaders
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python scripts/verify_gl.py

      - name: OpenGL backend tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/regression/test_gl_backend.py -v

      - name: Multi-planet rendering tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/regression/test_multi_planet.py -q

      - name: Explorer navigation, picking and label tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/regression/test_explorer.py tests/regression/test_explorer_b.py tests/regression/test_legacy_isolation.py -q

      # The scientific overlays: the habitable-zone band with its
      # boundary rings, and the orientation guides whose whole purpose is
      # that a normalised element must not be drawn like a measured one.
      - name: Scientific overlay tests (habitable zone, orientation)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/regression/test_explorer_c.py tests/regression/test_explorer_c2.py -q

      - name: Render the slice, a full system, the approach and the orientation cases
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python -m astro_explorer.app.slice_demo --out artifacts
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python -m astro_explorer.app.system_demo --host Kepler-11 --out artifacts
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python -m astro_explorer.app.explorer_demo --frames 6 --out artifacts
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python -m astro_explorer.app.orientation_demo --out artifacts

      # The render steps above exit non-zero on failure, but an empty
      # output directory would still slip past if a demo ever changed its
      # mind about where to write. Assert the frames exist.
      - name: Check the frames were actually produced
        run: |
          shopt -s nullglob
          frames=(artifacts/*.png)
          if [ ${#frames[@]} -lt 11 ]; then
            echo "expected at least 11 rendered frames, found ${#frames[@]}"
            ls -la artifacts || true
            exit 1
          fi
          echo "rendered ${#frames[@]} frame(s):"
          ls -la artifacts/*.png

      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-frames
          path: artifacts/*.png
          if-no-files-found: warn
